<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../logo-untan.png">
  <link rel="apple-touch-icon" href="../logo-untan.png">
  <title>Admin — Mitra</title>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../js/supabase-client.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');
    :root{--navy:#1a2e1e;--green:#4e8c5a;--light:#68b077;--cream:#f2f5ef;--white:#ffffff;--border:rgba(26,46,30,0.1);--text:#2d3a2e;--muted:rgba(45,58,46,0.55);--danger:#dc2626;--dangerBg:#fef2f2;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}
    .sidebar{position:fixed;top:0;left:0;height:100vh;width:220px;background:var(--navy);display:flex;flex-direction:column;padding:0 0 24px;z-index:10;}
    .sidebar-logo{display:flex;align-items:center;gap:10px;padding:24px 20px;border-bottom:1px solid rgba(255,255,255,0.08);}
    .logo-icon{width:34px;height:34px;border-radius:8px;background:var(--green);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1rem;color:var(--cream);}
    .logo-text{font-size:0.8rem;font-weight:600;color:#fff;} .logo-sub{font-size:0.6rem;color:var(--light);letter-spacing:0.1em;text-transform:uppercase;}
    .nav-section{padding:16px 12px 8px;font-size:0.58rem;text-transform:uppercase;letter-spacing:0.15em;color:rgba(255,255,255,0.3);}
    .nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;margin:2px 8px;border-radius:8px;font-size:0.82rem;font-weight:500;color:rgba(255,255,255,0.65);text-decoration:none;transition:all 0.2s;cursor:pointer;background:none;border:none;width:calc(100% - 16px);text-align:left;}
    .nav-item:hover{background:rgba(255,255,255,0.07);color:#fff;} .nav-item.active{background:var(--green);color:#fff;}
    .sidebar-footer{margin-top:auto;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,0.08);}
    .back-link{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-size:0.8rem;color:rgba(255,255,255,0.4);text-decoration:none;} .back-link:hover{color:rgba(255,255,255,0.8);}
    .logout-btn{display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:8px;font-size:0.8rem;color:rgba(255,255,255,0.4);background:none;border:none;cursor:pointer;width:100%;} .logout-btn:hover{color:#ff8080;}
    .main{margin-left:220px;min-height:100vh;}
    .topbar{background:var(--white);border-bottom:1px solid var(--border);padding:0 32px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5;}
    .topbar-title{font-size:1rem;font-weight:600;color:var(--navy);}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;font-size:0.82rem;font-family:'DM Sans',sans-serif;font-weight:500;text-decoration:none;cursor:pointer;border:none;transition:all 0.2s;}
    .btn-green{background:var(--green);color:#fff;} .btn-green:hover{background:var(--light);}
    .btn-danger{background:var(--dangerBg);color:var(--danger);border:1px solid #fecaca;} .btn-danger:hover{background:#fee2e2;}
    .btn-ghost{background:none;border:1px solid var(--border);color:var(--text);} .btn-ghost:hover{background:var(--cream);}
    .btn-sm{padding:5px 12px;font-size:0.75rem;}
    .content{padding:28px 32px;}
    .alert{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:0.85rem;font-weight:500;}
    .alert-success{background:#f0fdf4;border:1px solid #bbf7d0;color:#15803d;}
    .alert-error{background:var(--dangerBg);border:1px solid #fecaca;color:var(--danger);}
    .card{background:var(--white);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .card-title{font-size:0.9rem;font-weight:600;color:var(--navy);}
    .card-count{font-size:0.75rem;color:var(--muted);background:var(--cream);padding:2px 10px;border-radius:999px;}
    .card-header{flex-wrap:wrap;gap:10px;}
    .search-box{position:relative;display:flex;align-items:center;margin-left:auto;}
    .search-box>svg{position:absolute;left:10px;color:var(--muted);pointer-events:none;}
    .search-input{width:250px;padding:7px 12px 7px 32px;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.78rem;color:var(--text);background:var(--white);outline:none;transition:border-color 0.2s;}
    .search-input:focus{border-color:var(--green);}
    .search-input::placeholder{color:var(--muted);}
    .search-input::-webkit-search-cancel-button{cursor:pointer;}
    @media(max-width:640px){.search-box{width:100%;margin-left:0;}.search-input{width:100%;}}
    table{width:100%;border-collapse:collapse;}
    th{padding:10px 16px;font-size:0.68rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);border-bottom:1px solid var(--border);text-align:left;background:#fafafa;}
    td{padding:13px 16px;font-size:0.83rem;border-bottom:1px solid var(--border);vertical-align:middle;}
    tr:last-child td{border-bottom:none;} tr:hover td{background:#fafaf8;}
    .badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:0.65rem;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;}
    .partner-avatar{width:38px;height:38px;border-radius:10px;background:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.9rem;color:#fff;flex-shrink:0;}
    .actions-cell{display:flex;gap:6px;align-items:center;white-space:nowrap;justify-content:flex-end;}
    .modal-overlay{display:none;position:fixed;inset:0;z-index:50;background:rgba(26,46,30,0.45);backdrop-filter:blur(4px);align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal{background:var(--white);border-radius:16px;padding:28px 32px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.15);}
    .modal-icon{font-size:2rem;margin-bottom:12px;} .modal-title{font-size:1.05rem;font-weight:600;color:var(--navy);margin-bottom:6px;}
    .modal-body{font-size:0.85rem;color:var(--muted);margin-bottom:24px;line-height:1.5;}
    .modal-actions{display:flex;gap:10px;justify-content:flex-end;}
    .empty{text-align:center;padding:60px 20px;} .empty-icon{font-size:3rem;margin-bottom:12px;opacity:0.3;}
    .empty-title{font-size:1rem;font-weight:500;color:var(--navy);margin-bottom:6px;} .empty-sub{font-size:0.83rem;color:var(--muted);}
    @media(max-width:900px){th.hide-mobile,td.hide-mobile{display:none;}}
    @media(max-width:640px){.main{margin-left:0;}.topbar,.content{padding-left:16px;padding-right:16px;}}
  
    /* Mobile sidebar drawer */
    .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9; }
    .sidebar-overlay.open { display: block; }
    .mob-menu-btn { display: none; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; padding: 6px; border-radius: 8px; color: var(--navy); }
    .mob-menu-btn:hover { background: var(--cream); }
    @media(max-width:640px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.28s cubic-bezier(.4,0,.2,1); }
      .sidebar.open { transform: translateX(0); box-shadow: 4px 0 24px rgba(0,0,0,0.18); }
      .mob-menu-btn { display: flex; }
    }
  </style>
  <style id="auth-hide">body{visibility:hidden!important}</style>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<aside class="sidebar">
  <div class="sidebar-logo"><div class="logo-icon">U</div><div><div class="logo-text">Universitas</div><div class="logo-sub">Admin Panel</div></div></div>
  <div class="nav-section">Konten</div>
  <a class="nav-item" href="/admin"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h10"/></svg>Berita</a>
  <a class="nav-item" href="/admin/staff"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>Staf & Alumni</a>
  <a class="nav-item" href="/admin/struktur"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="5" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="8" y="16" width="8" height="5" rx="1"/><path d="M6.5 8v4h11V8"/><path d="M12 12v4"/></svg>Struktur Organisasi</a>
  
  <a class="nav-item" href="/admin/penelitian"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 3H5a2 2 0 0 0-2 2v4m6-6h10a2 2 0 0 1 2 2v4M9 3v18m0 0h10a2 2 0 0 0 2-2v-4M9 21H5a2 2 0 0 1-2-2v-4m0 0h18"/></svg>Penelitian</a>
  <a class="nav-item" href="/admin/pencapaian"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/></svg>Pencapaian</a>
  <a class="nav-item active" href="/admin/mitra"><svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Mitra</a>
  <div class="sidebar-footer">
    <a class="back-link" href="/"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>Lihat Situs</a>
    <button class="logout-btn" onclick="doLogout()"><svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Keluar</button>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <button class="mob-menu-btn" onclick="openSidebar()" aria-label="Menu">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="topbar-title">Manajemen Mitra</div>
    <a href="/admin/mitra-form" class="btn btn-green">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Tambah
    </a>
  </header>
  <div class="content">
    <div id="alertBox" style="display:none;"></div>
    <div class="card">
      <div class="card-header">
        <span class="card-title">Daftar Mitra</span>
        <div class="search-box">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="search" id="searchInput" class="search-input" placeholder="Cari nama, kategori, deskripsi…" autocomplete="off">
        </div>
        <span class="card-count" id="cardCount">memuat…</span>
      </div>
      <div id="tableWrap"><div class="empty"><div class="empty-icon">⏳</div><div class="empty-title">Memuat data…</div></div></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="deleteModal">
  <div class="modal">
    <div class="modal-icon" style="font-size:0;"><div style="width:48px;height:48px;background:#fef2f2;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div></div>
    <div class="modal-title">Hapus Mitra?</div>
    <div class="modal-body" id="deleteModalBody"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Batal</button>
      <button class="btn btn-danger" id="confirmDeleteBtn" onclick="doDelete()">Ya, Hapus</button>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', async () => {
const CAT_COLORS = {'Industri':'#2563eb','Akademik':'#16a34a','Pemerintah':'#d97706','Internasional':'#9333ea'};
let allData = [], deleteTargetId = null, searchQuery = '';

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/admin/login'; return; }
  document.getElementById('auth-hide')?.remove();
  loadData();
})();

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim().toLowerCase();
  renderTable();
});

async function loadData() {
  const { data, error } = await sb.from('mitra').select('*').order('since_year', { ascending: true });
  if (error) { showAlert('error', 'Gagal memuat: ' + error.message); return; }
  allData = data;
  renderTable();
  const p = new URLSearchParams(window.location.search);
  if (p.get('msg') === 'added')   showAlert('success', '✓ Mitra berhasil ditambahkan.');
  if (p.get('msg') === 'updated') showAlert('success', '✓ Mitra berhasil diperbarui.');
  window.history.replaceState({}, '', 'mitra.html');
}

function matchesSearch(item) {
  if (!searchQuery) return true;
  return [item.name, item.category, item.description, item.since_year, item.website_url]
    .some(v => String(v ?? '').toLowerCase().includes(searchQuery));
}

function renderTable() {
  const view = allData.filter(matchesSearch);
  document.getElementById('cardCount').textContent =
    searchQuery ? `${view.length} dari ${allData.length} mitra` : `${allData.length} mitra`;
  if (allData.length && !view.length) {
    document.getElementById('tableWrap').innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><div class="empty-title">Tidak ada hasil untuk “${escHtml(searchQuery)}”</div></div>`;
    return;
  }
  if (!allData.length) {
    document.getElementById('tableWrap').innerHTML = `<div class="empty"><div class="empty-icon" style="font-size:0;"><div style="width:56px;height:56px;background:var(--cream);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;"><svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="rgba(45,58,46,0.3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div></div><div class="empty-title">Belum ada mitra</div></div>`;
    return;
  }
  const rows = view.map(item => {
    const color = CAT_COLORS[item.category] || '#6b7a6c';
    const initial = (item.name || '?')[0].toUpperCase();
    return `<tr>
      <td><div style="display:flex;align-items:center;gap:12px;">
        <div class="partner-avatar">${initial}</div>
        <div>
          <div style="font-weight:500;color:var(--navy);">${escHtml(item.name)}</div>
          <div style="font-size:0.75rem;color:var(--muted);max-width:280px;">${escHtml((item.description||'').substring(0,60))}${(item.description||'').length>60?'…':''}</div>
        </div>
      </div></td>
      <td class="hide-mobile"><span class="badge" style="background:${color}18;color:${color};">${escHtml(item.category)}</span></td>
      <td class="hide-mobile" style="color:var(--muted);">Sejak ${item.since_year||'–'}</td>
      <td class="hide-mobile">${item.website_url ? `<a href="${escHtml(item.website_url)}" target="_blank" style="color:var(--green);font-size:0.78rem;">Website →</a>` : '<span style="color:var(--muted);">–</span>'}</td>
      <td><div class="actions-cell">
        <a href="/admin/mitra-form?edit=${item.id}" class="btn btn-ghost btn-sm">Edit</a>
        <button class="btn btn-danger btn-sm" onclick="confirmDelete(${item.id},'${escAttr(item.name)}')">Hapus</button>
      </div></td>
    </tr>`;
  }).join('');
  document.getElementById('tableWrap').innerHTML = `<div style="overflow-x:auto;"><table>
    <thead><tr><th>Nama</th><th class="hide-mobile">Kategori</th><th class="hide-mobile">Sejak</th><th class="hide-mobile">Website</th><th style="text-align:right;">Aksi</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function confirmDelete(id, name) {
  deleteTargetId = id;
  document.getElementById('deleteModalBody').textContent = `Hapus "${name}"?`;
  document.getElementById('deleteModal').classList.add('open');
}
function closeModal() { document.getElementById('deleteModal').classList.remove('open'); deleteTargetId = null; }
async function doDelete() {
  if (!deleteTargetId) return;
  const btn = document.getElementById('confirmDeleteBtn');
  btn.textContent = 'Menghapus…';
  // .select() makes Supabase return the deleted rows. Without it an RLS
  // denial looks identical to success: DELETE filters non-permitted rows
  // out rather than raising an error, so zero rows go quietly.
  const { data, error } = await sb.from('mitra').delete().eq('id', deleteTargetId).select();
  closeModal();
  btn.textContent = 'Ya, Hapus';
  if (error) { showAlert('error', 'Gagal menghapus: ' + error.message); return; }
  if (!data || !data.length) { showAlert('error', 'Gagal menghapus: tidak punya izin atau data sudah terhapus.'); return; }
  showAlert('success', '✓ Berhasil dihapus.');
  await loadData();
}

// Inline onclick= attributes resolve against global scope only, but this
// script runs inside a DOMContentLoaded callback — so these must be
// published to window or every delete button throws ReferenceError.
window.confirmDelete = confirmDelete;
window.closeModal    = closeModal;
window.doDelete      = doDelete;
document.getElementById('deleteModal').addEventListener('click', e => { if (e.target === document.getElementById('deleteModal')) closeModal(); });

function showAlert(type, msg) {
  const box = document.getElementById('alertBox');
  box.className = `alert alert-${type}`; box.textContent = msg; box.style.display = 'flex';
  setTimeout(() => { box.style.display = 'none'; }, 4000);
}
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s||'').replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
});
</script>
<script>
async function doLogout() { await sb.auth.signOut(); window.location.href = '/admin/login'; }
function openSidebar()  { document.querySelector('.sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); }
function closeSidebar() { document.querySelector('.sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }
</script>
</body>
</html>
