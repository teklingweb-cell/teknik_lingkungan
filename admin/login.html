<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="../logo-untan.png">
  <link rel="apple-touch-icon" href="../logo-untan.png">
  <title>Login — Admin Panel</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabase-client.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap');
    :root {
      --navy: #1a2e1e; --green: #4e8c5a; --light: #68b077;
      --cream: #f2f5ef; --white: #ffffff;
      --border: rgba(26,46,30,0.1); --text: #2d3a2e;
      --muted: rgba(45,58,46,0.55); --danger: #dc2626;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', Arial, sans-serif; background: var(--cream);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
    }
    .card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 380px;
      box-shadow: 0 4px 40px rgba(26,46,30,0.07);
    }
    .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
    .logo-icon {
      width: 40px; height: 40px; border-radius: 10px; background: var(--navy);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; color: var(--cream);
    }
    .logo-text { font-size: 0.85rem; font-weight: 600; color: var(--navy); line-height: 1.2; }
    .logo-sub  { font-size: 0.65rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
    h1 { font-size: 1.2rem; font-weight: 600; color: var(--navy); margin-bottom: 4px; }
    .subtitle { font-size: 0.83rem; color: var(--muted); margin-bottom: 28px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    input {
      width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px;
      font-size: 0.875rem; color: var(--text); font-family: 'Inter', Arial, sans-serif;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(78,140,90,0.15); }
    .btn {
      width: 100%; padding: 11px; border-radius: 8px; font-size: 0.9rem;
      font-family: 'Inter', Arial, sans-serif; font-weight: 600; cursor: pointer;
      border: none; background: var(--navy); color: #fff; transition: background 0.2s;
      margin-top: 8px;
    }
    .btn:hover:not(:disabled) { background: #243328; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .alert {
      padding: 10px 14px; border-radius: 8px; font-size: 0.82rem;
      margin-bottom: 16px; display: none;
    }
    .alert-error { background: #fef2f2; border: 1px solid #fecaca; color: var(--danger); display: block; }
  </style>
  <style id="auth-hide">body{visibility:hidden!important}</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">U</div>
    <div>
      <div class="logo-text">Universitas</div>
      <div class="logo-sub">Admin Panel</div>
    </div>
  </div>
  <h1>Masuk ke Dashboard</h1>
  <p class="subtitle">Gunakan akun admin untuk melanjutkan.</p>

  <div class="alert" id="errBox"></div>

  <div class="field">
    <label>Email</label>
    <input type="email" id="email" placeholder="admin@universitas.ac.id" autocomplete="email">
  </div>
  <div class="field">
    <label>Password</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn" id="loginBtn" onclick="doLogin()">Masuk</button>
</div>

<script>
  // Redirect if already logged in
  (async () => {
    const { data: { session } } = await sb.auth.getSession();
    if (session) { window.location.href = '/admin'; } else { document.getElementById('auth-hide')?.remove(); }
  })();

  async function doLogin() {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('loginBtn');
    const errBox   = document.getElementById('errBox');

    errBox.className = 'alert';
    if (!email || !password) {
      errBox.textContent = 'Email dan password wajib diisi.';
      errBox.classList.add('alert-error'); return;
    }

    btn.disabled = true; btn.textContent = 'Memproses…';
    const { error } = await sb.auth.signInWithPassword({ email, password });

    if (error) {
      errBox.textContent = 'Login gagal: ' + error.message;
      errBox.classList.add('alert-error');
      btn.disabled = false; btn.textContent = 'Masuk';
    } else {
      window.location.href = '/admin';
    }
  }

  // Allow Enter key
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
